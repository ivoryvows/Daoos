
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAOOS Key Generator</title>
<style>
body{font-family:Arial;background:#652B3D;color:#fff;padding:24px}
button{background:#D4BD8C;color:#35202a;border:0;padding:14px;border-radius:10px;font-weight:bold;width:100%}
textarea{width:100%;height:90px;margin:10px 0;border-radius:8px;padding:10px;box-sizing:border-box}
p{overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>DAOOS — Secure Key Generator</h2>
<p>Generate your private notification keys on this device.</p>
<button onclick="generate()">Generate VAPID Keys</button>
<h3>Public key</h3>
<textarea id="pub" readonly></textarea>
<button onclick="copyKey('pub')">Copy public key</button>
<h3>Private key — KEEP SECRET</h3>
<textarea id="priv" readonly></textarea>
<button onclick="copyKey('priv')">Copy private key</button>
<p id="status"></p>
<script>
function b64url(bytes){
 let s="";
 bytes.forEach(b=>s+=String.fromCharCode(b));
 return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function generate(){
 try{
  const pair=await crypto.subtle.generateKey(
   {name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]
  );
  const pub=await crypto.subtle.exportKey("raw",pair.publicKey);
  const jwk=await crypto.subtle.exportKey("jwk",pair.privateKey);
  document.getElementById("pub").value=b64url(new Uint8Array(pub));
  document.getElementById("priv").value=jwk.d;
  document.getElementById("status").textContent="Keys generated on this device.";
 }catch(e){
  document.getElementById("status").textContent="Error: "+e.message;
 }
}
async function copyKey(id){
 const el=document.getElementById(id);
 await navigator.clipboard.writeText(el.value);
 document.getElementById("status").textContent="Copied.";
}
</script>
</body>
</html>
